<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#16213e">
    <title>Cinci mausolee ale lumii</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #16213e;
        background: #f3f5f9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 32px 20px;
      }

      main {
        width: min(100%, 1000px);
        margin: 0 auto;
      }

      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: clamp(1.5rem, 4vw, 2rem);
      }

      p {
        margin: 0;
        color: #5b6475;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .button {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        padding: 10px 16px;
        border: 1px solid #16213e;
        border-radius: 8px;
        color: #16213e;
        font-weight: 650;
        text-decoration: none;
      }

      .button.primary {
        color: #fff;
        background: #16213e;
      }

      .button:hover {
        opacity: 0.85;
      }

      .viewer {
        overflow: hidden;
        min-height: 70vh;
        border: 1px solid #d9deea;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 12px 36px rgb(22 33 62 / 10%);
      }

      iframe {
        display: block;
        width: 100%;
        height: min(78vh, 1050px);
        min-height: 70vh;
        border: 0;
      }

      @media (max-width: 560px) {
        body {
          padding: 22px 12px;
        }

        header,
        .actions {
          align-items: stretch;
          flex-direction: column;
        }

        .viewer {
          min-height: 68vh;
        }

        iframe {
          height: 68vh;
          min-height: 68vh;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Cinci mausolee ale lumii</h1>
          <p>Răsfoiește documentul sau descarcă PDF-ul pentru mai târziu.</p>
        </div>
        <nav class="actions" aria-label="Acțiuni pentru PDF">
          <a class="button primary" href="mausolee.pdf" download>Descarcă PDF</a>
          <a class="button" href="mausolee.pdf" target="_blank" rel="noopener">Deschide separat</a>
        </nav>
      </header>
      <section class="viewer" aria-label="Vizualizator PDF">
        <iframe src="mausolee.pdf" title="Cinci mausolee ale lumii — document PDF">
          Browserul tău nu poate afișa PDF-uri.
          <a href="mausolee.pdf" download>Descarcă documentul PDF</a>.
        </iframe>
      </section>
    </main>
  </body>
</html>
